<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英語プリント総復習ノート</title>
<style>
  :root{
    --paper:#FBF8F1;
    --paper-line:#DCD3BF;
    --ink:#2A2620;
    --ink-soft:#6b6558;
    --pen:#3A5AA8;
    --pen-soft:#7C93C9;
    --red:#C8422F;
    --red-soft:#f3d8d1;
    --green:#3C7A4C;
    --green-soft:#dcecdd;
    --hl1:#F4D35E; /* Jobs - yellow */
    --hl2:#EE964B; /* Home - orange */
    --hl3:#B8C77E; /* Happiness - olive */
    --hl4:#7FB2C9; /* AmAus - blue */
    --hl5:#C994C7; /* Argumentation - purple */
    --hl6:#E0876E; /* Disaster/Travel - terracotta */
    --hl7:#8FBFA3; /* Presentation - sage */
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      linear-gradient(var(--paper-line) 1px, transparent 1px);
    background-size: 100% 34px;
    color:var(--ink);
    font-family: "Hiragino Mincho ProN","Georgia", serif;
    line-height:1.7;
    padding-bottom:80px;
  }
  header{
    padding:38px 20px 18px;
    text-align:center;
    border-bottom:3px solid var(--ink);
    background:var(--paper);
    position:relative;
  }
  header::before{
    content:"REVIEW NOTEBOOK";
    display:block;
    font-family:"Courier New", monospace;
    letter-spacing:4px;
    font-size:11px;
    color:var(--ink-soft);
    margin-bottom:8px;
  }
  h1{
    font-size:1.7rem;
    margin:0 0 6px;
    font-weight:700;
  }
  header p{
    font-family:"Hiragino Sans","Yu Gothic",sans-serif;
    font-size:0.85rem;
    color:var(--ink-soft);
    margin:0;
  }

  nav#tabs{
    display:flex;
    overflow-x:auto;
    gap:6px;
    padding:14px 12px;
    background:var(--paper);
    position:sticky;
    top:0;
    z-index:10;
    border-bottom:1px solid var(--paper-line);
    -webkit-overflow-scrolling:touch;
  }
  nav#tabs::-webkit-scrollbar{display:none;}
  .tab-btn{
    flex:0 0 auto;
    font-family:"Hiragino Sans","Yu Gothic",sans-serif;
    font-size:0.78rem;
    font-weight:700;
    padding:8px 12px;
    border:2px solid var(--ink);
    background:#fff;
    border-radius:3px 3px 0 0;
    cursor:pointer;
    color:var(--ink);
    white-space:nowrap;
    transform:translateY(4px);
    transition:transform .15s ease;
  }
  .tab-btn.active{
    transform:translateY(0);
    box-shadow: 0 3px 0 var(--ink);
  }

  main{max-width:720px;margin:0 auto;padding:0 16px;}
  section.unit{display:none;padding-top:22px;}
  section.unit.active{display:block;}

  .unit-head{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom:4px;
  }
  .unit-head .swatch{
    width:14px;height:14px;border:2px solid var(--ink);flex:0 0 auto;
  }
  .unit-head h2{
    font-size:1.25rem;
    margin:0;
  }
  .unit-sub{
    font-family:"Hiragino Sans","Yu Gothic",sans-serif;
    font-size:0.8rem;
    color:var(--ink-soft);
    margin:0 0 18px 24px;
  }

  h3.block-title{
    font-family:"Hiragino Sans","Yu Gothic",sans-serif;
    font-size:0.9rem;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
    color:#fff;
    display:inline-block;
    padding:3px 10px;
    margin:26px 0 14px;
  }

  /* vocab table */
  .vocab-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:0;
    border-top:1px solid var(--ink);
    margin-bottom:10px;
  }
  .vocab-row{
    display:grid;
    grid-template-columns: 34% 1fr;
    gap:10px;
    padding:9px 4px;
    border-bottom:1px dashed var(--paper-line);
    font-size:0.92rem;
  }
  .vocab-row .term{
    font-weight:700;
    color:var(--pen);
  }
  .vocab-row .def{
    font-family:"Hiragino Sans","Yu Gothic",sans-serif;
    font-size:0.83rem;
    color:var(--ink);
  }

  /* quiz cards */
  .qcard{
    background:#fff;
    border:1px solid var(--paper-line);
    border-left:4px solid var(--ink);
    border-radius:2px;
    padding:16px 16px 14px;
    margin-bottom:16px;
    position:relative;
  }
  .qcard .qnum{
    font-family:"Courier New",monospace;
    font-size:0.72rem;
    color:var(--ink-soft);
    margin-bottom:6px;
    letter-spacing:1px;
  }
  .qcard .context{
    font-family:"Hiragino Sans","Yu Gothic",sans-serif;
    font-size:0.78rem;
    color:var(--ink-soft);
    margin-bottom:8px;
    line-height:1.6;
  }
  .qcard .qtext{
    font-size:1rem;
    margin-bottom:12px;
  }
  .qcard .qtext .gap{
    display:inline-block;
    min-width:70px;
    border-bottom:2px solid var(--ink);
    text-align:center;
    font-weight:700;
    color:var(--pen);
  }
  .choices{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
  }
  @media (max-width:420px){
    .choices{grid-template-columns:1fr;}
  }
  .choice-btn{
    font-family:"Hiragino Sans","Yu Gothic",sans-serif;
    font-size:0.85rem;
    text-align:left;
    padding:9px 10px;
    border:1.5px solid var(--ink);
    background:#fff;
    border-radius:3px;
    cursor:pointer;
    color:var(--ink);
  }
  .choice-btn:active{transform:translateY(1px);}
  .choice-btn.correct{
    background:var(--green-soft);
    border-color:var(--green);
    color:var(--green);
    font-weight:700;
  }
  .choice-btn.wrong{
    background:var(--red-soft);
    border-color:var(--red);
    color:var(--red);
    text-decoration:line-through;
  }
  .choice-btn[disabled]{cursor:default;}
  .feedback{
    margin-top:10px;
    font-family:"Hiragino Sans","Yu Gothic",sans-serif;
    font-size:0.8rem;
    font-weight:700;
    display:none;
  }
  .feedback.show{display:block;}
  .feedback.ok{color:var(--green);}
  .feedback.ng{color:var(--red);}

  .score-bar{
    position:sticky;
    bottom:0;
    background:var(--ink);
    color:var(--paper);
    font-family:"Hiragino Sans","Yu Gothic",sans-serif;
    font-size:0.82rem;
    padding:10px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:20px;
    border-radius:3px;
  }
  .score-bar button{
    font-family:"Hiragino Sans","Yu Gothic",sans-serif;
    background:var(--paper);
    color:var(--ink);
    border:none;
    padding:6px 12px;
    border-radius:3px;
    font-size:0.78rem;
    font-weight:700;
    cursor:pointer;
  }
</style>
</head>

</header>

/* ---- auto-generate one vocab question for EVERY vocabulary/idiom item ---- */
function buildVocabQuestions(vocab){
  const n = vocab.length;
  return vocab.map(([term,def], i)=>{
    const distractorIdx = [];
    let step = 1;
    while(distractorIdx.length < 3 && distractorIdx.length < n-1){
      const idx = (i+step) % n;
      if(idx !== i) distractorIdx.push(idx);
      step++;
    }
    const correctPos = i % Math.min(4, distractorIdx.length+1);
    const choices = [];
    let dPtr = 0;
    const total = distractorIdx.length + 1;
    for(let pos = 0; pos < total; pos++){
      if(pos === correctPos){ choices.push(def); }
      else { choices.push(vocab[distractorIdx[dPtr]][1]); dPtr++; }
    }
    return {type:"vocab", q:`「${term}」の意味として最も適切なものは?`, choices, a:correctPos};
  });
}

UNITS.forEach(u=>{
  const blankQs = (u.blanks || []).map(b => ({ type:"blank", ...b }));
  u.quiz = buildVocabQuestions(u.vocab).concat(blankQs);
});

/* ============ RENDER ============ */
const tabsEl = document.getElementById('tabs');
const content = document.getElementById('content');

UNITS.forEach((u, idx)=>{
  const btn = document.createElement('button');
  btn.className = 'tab-btn' + (idx===0?' active':'');
  btn.style.borderBottom = `4px solid ${u.color}`;
  btn.textContent = u.title.replace(/^[①-⑩]\s*/,'').length>10 ? u.title.split(' ')[0] : u.title;
  btn.dataset.target = u.id;
  btn.addEventListener('click', ()=> showUnit(u.id));
  tabsEl.appendChild(btn);

  const sec = document.createElement('section');
  sec.className = 'unit' + (idx===0?' active':'');
  sec.id = 'unit-'+u.id;

  let html = `
    <div class="unit-head"><div class="swatch" style="background:${u.color}"></div><h2>${u.title}</h2></div>
    <p class="unit-sub">${u.sub}</p>
    <h3 class="block-title" style="background:${u.color}">単語・イディオム</h3>
    <div class="vocab-grid">`;
  u.vocab.forEach(([term,def])=>{
    html += `<div class="vocab-row"><div class="term">${term}</div><div class="def">${def}</div></div>`;
  });
  html += `</div>
    <h3 class="block-title" style="background:${u.color}">4択問題</h3>
    <div class="quizzes" data-unit="${u.id}"></div>
    <div class="score-bar">
      <span class="score-label" data-unit-score="${u.id}">正解 0 / ${u.quiz.length}</span>
      <button class="reset-btn" data-unit-reset="${u.id}">やり直す</button>
    </div>`;
  sec.innerHTML = html;
  content.appendChild(sec);

  renderQuiz(u);
});

function renderQuiz(u){
  const container = document.querySelector(`.quizzes[data-unit="${u.id}"]`);
  container.innerHTML = '';
  u.quiz.forEach((item, i)=>{
    const card = document.createElement('div');
    card.className = 'qcard';
    let qHtml = `<div class="qnum">Q${i+1} / ${u.quiz.length}</div>`;
    if(item.type === 'blank'){
      qHtml += `<div class="context">${item.context}</div>
        <div class="qtext">${item.before} <span class="gap">___</span> ${item.after}</div>`;
    } else {
      qHtml += `<div class="qtext">${item.q}</div>`;
    }
    qHtml += `<div class="choices"></div><div class="feedback"></div>`;
    card.innerHTML = qHtml;
    const choicesEl = card.querySelector('.choices');
    const feedbackEl = card.querySelector('.feedback');
    item.choices.forEach((c, ci)=>{
      const cb = document.createElement('button');
      cb.className = 'choice-btn';
      cb.textContent = c;
      cb.addEventListener('click', ()=>{
        if(cb.disabled) return;
        const allBtns = choicesEl.querySelectorAll('.choice-btn');
        allBtns.forEach(b=> b.disabled = true);
        if(ci === item.a){
          cb.classList.add('correct');
          feedbackEl.textContent = '○ 正解!';
          feedbackEl.className = 'feedback show ok';
          bumpScore(u.id, true);
        } else {
          cb.classList.add('wrong');
          allBtns[item.a].classList.add('correct');
          feedbackEl.textContent = '× 不正解。正解は「' + item.choices[item.a] + '」';
          feedbackEl.className = 'feedback show ng';
          bumpScore(u.id, false);
        }
      });
      choicesEl.appendChild(cb);
    });
    container.appendChild(card);
  });
}

const scores = {};
UNITS.forEach(u=> scores[u.id] = {correct:0, answered:0});

function bumpScore(id, correct){
  scores[id].answered++;
  if(correct) scores[id].correct++;
  const label = document.querySelector(`[data-unit-score="${id}"]`);
  const total = UNITS.find(u=>u.id===id).quiz.length;
  label.textContent = `正解 ${scores[id].correct} / ${total}`;
}

document.addEventListener('click', (e)=>{
  if(e.target.matches('[data-unit-reset]')){
    const id = e.target.dataset.unitReset;
    scores[id] = {correct:0, answered:0};
    const u = UNITS.find(u=>u.id===id);
    document.querySelector(`[data-unit-score="${id}"]`).textContent = `正解 0 / ${u.quiz.length}`;
    renderQuiz(u);
  }
});

function showUnit(id){
  document.querySelectorAll('section.unit').forEach(s=> s.classList.toggle('active', s.id === 'unit-'+id));
  document.querySelectorAll('.tab-btn').forEach(b=> b.classList.toggle('active', b.dataset.target === id));
  window.scrollTo({top:0, behavior:'smooth'});
}
</script>
